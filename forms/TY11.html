<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TY11 安全“四步法”检查评价表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    padding: 12px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  .toolbar {
    background: #1a3a5c;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .toolbar h1 {
    font-size: 16px;
    color: #fff;
    margin-right: auto;
    font-weight: 600;
  }
  .toolbar .back-link {
    color: #b8c7d9;
    font-size: 13px;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
  }

  .btn {
    padding: 8px 14px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    background: #2b6cb0;
    color: #fff;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn.gray { background: #4a5568; }
  .btn.green { background: #2f855a; }
  .btn.orange { background: #c05621; }
  .btn.red { background: #c53030; }

  .sheet {
    background: #fff;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 12px;
  }

  .sheet-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #1a3a5c;
    padding-bottom: 12px;
    border-bottom: 2px solid #1a3a5c;
    margin-bottom: 16px;
  }

  .meta {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .meta .field {
    display: flex;
    align-items: center;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    overflow: hidden;
  }
  .meta .field label {
    background: #f7fafc;
    padding: 9px 10px;
    font-size: 13px;
    color: #4a5568;
    white-space: nowrap;
    border-right: 1px solid #d0d5dd;
    min-width: 78px;
    text-align: center;
  }
  .meta .field input {
    flex: 1;
    border: none;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  @media (max-width: 600px) {
    .meta { grid-template-columns: 1fr; }
  }

  .check-list {
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    overflow: hidden;
  }
  .check-header {
    background: #1a3a5c;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 8px;
  }
  .check-item {
    padding: 12px;
    border-bottom: 1px solid #e2e8f0;
    background: #fff;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item .row1 {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 8px;
    align-items: flex-start;
  }
  .check-item .idx {
    color: #4a5568;
    font-size: 13px;
    text-align: center;
    padding-top: 2px;
  }
  .check-item .content {
    font-size: 14px;
    line-height: 1.7;
    color: #1a1a1a;
  }
  .check-item .row2 {
    margin-top: 10px;
    padding-left: 50px;
  }
  .opts {
    display: flex;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
    max-width: 360px;
  }
  .opts label {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    font-size: 13px;
    cursor: pointer;
    background: #fff;
    color: #4a5568;
    border-right: 1px solid #d0d5dd;
    transition: all 0.12s;
    user-select: none;
    white-space: nowrap;
  }
  .opts label:last-child { border-right: none; }
  .opts input { display: none; }
  .opts input:checked + label { color: #fff; font-weight: 600; }
  .opts input[value="合格"]:checked + label { background: #2f855a; }
  .opts input[value="不合格"]:checked + label { background: #c53030; }
  .opts input[value="不适用"]:checked + label { background: #718096; }

  @media (max-width: 600px) {
    .check-item .row2 { padding-left: 50px; }
    .opts { max-width: 100%; }
  }

  /* ====== 底部统计（合并成一行） ====== */
  .summary {
    margin-top: 16px;
    display: flex;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    overflow: hidden;
    background: #f7fafc;
  }
  .summary .box {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    border-right: 1px solid #d0d5dd;
    min-width: 0;
  }
  .summary .box:last-child { border-right: none; }
  .summary .box .num {
    font-size: 20px;
    font-weight: 700;
    color: #1a3a5c;
    line-height: 1.2;
  }
  .summary .box .lbl {
    font-size: 11px;
    color: #718096;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 480px) {
    .summary .box .num { font-size: 18px; }
    .summary .box .lbl { font-size: 10px; }
  }

  .conclusion {
    margin-top: 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .conclusion .lbl {
    font-size: 14px;
    color: #4a5568;
    font-weight: 600;
  }
  .conclusion .val {
    font-size: 18px;
    font-weight: 700;
  }
  .conclusion .val.you { color: #2f855a; }
  .conclusion .val.hege { color: #2b6cb0; }
  .conclusion .val.buhege { color: #c53030; }

  .remark-box { margin-top: 14px; }
  .remark-box label {
    display: block;
    font-size: 14px;
    color: #4a5568;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .remark-box textarea {
    width: 100%;
    min-height: 70px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    resize: vertical;
    line-height: 1.6;
  }
  .remark-box textarea:focus { border-color: #2b6cb0; }

  .sign-row {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 600px) {
    .sign-row { grid-template-columns: 1fr; }
  }
  .sign-row .sign-field {
    display: flex;
    align-items: center;
    border-bottom: 1px solid #4a5568;
    padding-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .sign-row .sign-field label {
    font-size: 14px;
    color: #4a5568;
    font-weight: 600;
    white-space: nowrap;
    margin-right: 4px;
  }
  .sign-row .sign-field input[type="text"] {
    flex: 1;
    border: none;
    padding: 6px 4px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    background: transparent;
    min-width: 80px;
  }
  .sign-row .sign-field .date-suffix {
    font-size: 13px;
    color: #718096;
    white-space: nowrap;
    margin-left: 6px;
  }
  .sign-row .sign-field input[type="date"] {
    border: none;
    padding: 4px;
    font-size: 13px;
    font-family: inherit;
    background: transparent;
    outline: none;
    color: #4a5568;
    max-width: 140px;
  }

  .history {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .history h2 {
    font-size: 15px;
    color: #1a3a5c;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 4px solid #2b6cb0;
  }
  .history-item {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .history-item .info {
    flex: 1;
    min-width: 200px;
  }
  .history-item .name {
    font-size: 14px;
    font-weight: 600;
    color: #1a3a5c;
  }
  .history-item .meta-line {
    font-size: 12px;
    color: #718096;
    margin-top: 4px;
  }
  .history-item .rate {
    font-size: 14px;
    font-weight: 700;
    color: #2f855a;
    margin-right: 6px;
  }
  .history-item .rate.bad { color: #c53030; }
  .history-item .rate.mid { color: #2b6cb0; }
  .history-item .actions {
    display: flex;
    gap: 6px;
  }
  .history-item .actions button {
    padding: 6px 10px;
    font-size: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    color: #fff;
  }
  .history-item .actions .open { background: #2b6cb0; }
  .history-item .actions .del { background: #c53030; }
  .empty-history {
    text-align: center;
    color: #a0aec0;
    font-size: 13px;
    padding: 24px 0;
  }

  /* ============ 打印样式 ============ */
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .history, .no-print { display: none !important; }
    .sheet {
      box-shadow: none;
      border-radius: 0;
      padding: 0;
      margin: 0;
    }
    .sheet-title { font-size: 16px; }
    .meta .field label { background: #fff; }

    .check-header {
      background: #e2e8f0 !important;
      color: #1a1a1a !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .check-item .content {
      font-size: 15px !important;
      line-height: 1.6 !important;
    }
    .check-item .idx {
      font-size: 14px !important;
    }

    .check-item .row2 {
      padding-left: 50px !important;
      margin-top: 6px !important;
    }
    .opts {
      max-width: 280px !important;
      display: flex !important;
    }
    .opts label {
      flex: 1 !important;
      padding: 4px 4px !important;
      font-size: 11px !important;
      background: #fff !important;
      color: #4a5568 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .opts input:checked + label {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .opts input[value="合格"]:checked + label { background: #2f855a !important; color: #fff !important; }
    .opts input[value="不合格"]:checked + label { background: #c53030 !important; color: #fff !important; }
    .opts input[value="不适用"]:checked + label { background: #718096 !important; color: #fff !important; }

    .check-item {
      padding: 8px 12px !important;
    }

    /* 底部统计一行 */
    .summary {
      display: flex !important;
      background: #fff !important;
    }
    .summary .box {
      border-right: 1px solid #000 !important;
      padding: 8px 4px !important;
    }
    .summary .box:last-child { border-right: none !important; }
    .summary .box .num { font-size: 16px !important; }
    .summary .box .lbl { font-size: 11px !important; color: #333 !important; }

    .conclusion {
      border: 1px solid #000 !important;
      padding: 8px 12px !important;
    }
    .conclusion .val { font-size: 16px !important; }

    .sign-row .sign-field { border-bottom: 1px solid #000; }

    .summary, .conclusion, .remark-box, .sign-row {
      page-break-inside: avoid;
    }
    .check-item {
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="toolbar no-print">
    <a class="back-link" href="../index.html">← 返回</a>
    <h1>TY11 安全“四步法”检查评价表</h1>
    <button class="btn green" onclick="saveRecord()">保存</button>
    <button class="btn" onclick="exportPDF()">导出 PDF</button>
    <button class="btn gray" onclick="newRecord()">新建</button>
  </div>

  <div class="sheet" id="sheet">

    <div class="sheet-title">TY11 安全“四步法”检查评价表</div>

    <div class="meta">
      <div class="field">
        <label>工程名称</label>
        <input type="text" id="projectName" placeholder="可不填">
      </div>
      <div class="field">
        <label>检查日期</label>
        <input type="date" id="checkDate">
      </div>
      <div class="field">
        <label>检查人</label>
        <input type="text" id="inspector" placeholder="可不填">
      </div>
      <div class="field">
        <label>受检分部</label>
        <input type="text" id="checkedUnit" placeholder="可不填">
      </div>
    </div>

    <div class="check-list">
      <div class="check-header">
        <div>序号</div>
        <div>检查评价项目</div>
      </div>
      <div id="checkBody"></div>
    </div>

    <!-- 底部统计（合并到一行） -->
    <div class="summary">
      <div class="box">
        <div class="num" id="sumTotal">0</div>
        <div class="lbl">检查项总数</div>
      </div>
      <div class="box">
        <div class="num" id="sumPass" style="color:#2f855a;">0</div>
        <div class="lbl">合格项总数</div>
      </div>
      <div class="box">
        <div class="num" id="sumFail" style="color:#c53030;">0</div>
        <div class="lbl">不合格项总数</div>
      </div>
    </div>

    <div class="conclusion">
      <span class="lbl">合格率：</span>
      <span class="val" id="rateVal">0%</span>
      <span class="lbl" style="margin-left:16px;">评价结论：</span>
      <span class="val" id="conclusionVal">—</span>
    </div>

    <div class="remark-box">
      <label>备注 / 检查结果</label>
      <textarea id="remark" placeholder="可手写或输入"></textarea>
    </div>

    <div class="sign-row">
      <div class="sign-field">
        <label>检查人签名：</label>
        <input type="text" id="signInspector" placeholder="">
        <span class="date-suffix">日期：</span>
        <input type="date" id="signInspectorDate">
      </div>
      <div class="sign-field">
        <label>受检人签名：</label>
        <input type="text" id="signChecked" placeholder="">
        <span class="date-suffix">日期：</span>
        <input type="date" id="signCheckedDate">
      </div>
    </div>

  </div>

  <div class="history no-print">
    <h2>历史记录</h2>
    <div id="historyList"></div>
  </div>

</div>

<script>
const CHECK_ITEMS = [
  "【作业指导书】根据作业任务选择适用的作业指导书，作业指导书的内容与现场实际情况相符。",
  "【作业指导书】对作业指导书进行差异化分析，差异化分析的结果与现场实际情况相符。",
  "【作业指导书】现场作业应按作业指导书的作业内容、作业流程、安全风险辨析及控制措施、作业方法、质量控制措施及检验标准等进行施工。",
  "【安全风险分析与预控】作业前应进行安全风险分析。",
  "【安全风险分析与预控】安全风险分析应与现场作业环境和风险相符。",
  "【安全风险分析与预控】根据安全风险分析落实风险预控措施。",
  "【安全施工作业票】安全施工作业票与现场实际内容相符，不得随意打勾。",
  "【安全施工作业票】在作业票的有效期内使用（10天）。",
  "【安全施工作业票】安全施工作业票填写规范，新增加人员在接受交底后补充签名。",
  "【安全施工作业票】作业现场工作内容、地点、安全措施变更后应重新办理安全工作票。",
  "【安全施工作业票】安全施工作业票签名人员必须与现场作业人员一致，保证签名的真实性。",
  "【站班会】开工前班组长组织开展站班会。",
  "【站班会】站班会安全技术交底等“三交”工作与现场实际应相符，安全控制措施落实到位。",
  "【站班会】站班会记录（或日志）应体现“三交”、“三查”等内容。",
  "【站班会】站班会记录签名人员必须与现场作业人员一致，保证签名的真实性。",
];

const STORAGE_KEY = "TY11_records";

const SITE_INFO_KEY = "site_check_info";

function loadSiteInfo() {
  try {
    const raw = localStorage.getItem(SITE_INFO_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function applySiteInfo() {
  const data = loadSiteInfo();
  if (!data) return;
  const pn = document.getElementById("projectName");
  const cd = document.getElementById("checkDate");
  const ins = document.getElementById("inspector");
  const cu = document.getElementById("checkedUnit");
  const sid = document.getElementById("signInspectorDate");
  const scd = document.getElementById("signCheckedDate");
  if (pn) pn.value = data.projectName || "";
  if (cd) cd.value = data.checkDate || new Date().toISOString().slice(0, 10);
  if (ins) ins.value = data.inspector || "";
  if (cu) cu.value = data.checkedUnit || "";
  if (sid) sid.value = data.checkDate || new Date().toISOString().slice(0, 10);
  if (scd) scd.value = data.checkDate || new Date().toISOString().slice(0, 10);
}


function renderItems() {
  const body = document.getElementById("checkBody");
  body.innerHTML = CHECK_ITEMS.map((item, i) => `
    <div class="check-item">
      <div class="row1">
        <div class="idx">${i + 1}</div>
        <div class="content">${item}</div>
      </div>
      <div class="row2">
        <div class="opts">
          <input type="radio" name="item${i}" id="item${i}_ok" value="合格" onchange="updateStats()">
          <label for="item${i}_ok">合格</label>
          <input type="radio" name="item${i}" id="item${i}_ng" value="不合格" onchange="updateStats()">
          <label for="item${i}_ng">不合格</label>
          <input type="radio" name="item${i}" id="item${i}_na" value="不适用" onchange="updateStats()">
          <label for="item${i}_na">不适用</label>
        </div>
      </div>
    </div>
  `).join("");
}

/* 合格率 = 合格数 / (合格数 + 不合格数)，不适用不计入 */
function calcStats(answers) {
  let pass = 0, fail = 0, na = 0;
  answers.forEach(a => {
    if (a === "合格") pass++;
    else if (a === "不合格") fail++;
    else if (a === "不适用") na++;
  });
  const total = pass + fail;
  const rate = total > 0 ? (pass / total * 100) : 0;
  let conclusion = "—";
  if (total > 0) {
    if (rate >= 90) conclusion = "优";
    else if (rate >= 70) conclusion = "合格";
    else conclusion = "不合格";
  }
  return { total, pass, fail, na, rate, conclusion };
}

function updateStats() {
  const answers = CHECK_ITEMS.map((_, i) => {
    const checked = document.querySelector(`input[name="item${i}"]:checked`);
    return checked ? checked.value : "";
  });
  const s = calcStats(answers);

  document.getElementById("sumTotal").textContent = s.total;
  document.getElementById("sumPass").textContent = s.pass;
  document.getElementById("sumFail").textContent = s.fail;
  document.getElementById("rateVal").textContent = s.rate.toFixed(1) + "%";

  const conclusionEl = document.getElementById("conclusionVal");
  if (s.total === 0) {
    conclusionEl.textContent = "—";
    conclusionEl.className = "val";
  } else if (s.rate >= 90) {
    conclusionEl.textContent = "优";
    conclusionEl.className = "val you";
  } else if (s.rate >= 70) {
    conclusionEl.textContent = "合格";
    conclusionEl.className = "val hege";
  } else {
    conclusionEl.textContent = "不合格";
    conclusionEl.className = "val buhege";
  }
}

function collectData() {
  const answers = CHECK_ITEMS.map((_, i) => {
    const checked = document.querySelector(`input[name="item${i}"]:checked`);
    return checked ? checked.value : "";
  });
  const s = calcStats(answers);
  return {
    projectName: document.getElementById("projectName").value.trim(),
    checkDate: document.getElementById("checkDate").value,
    inspector: document.getElementById("inspector").value.trim(),
    checkedUnit: document.getElementById("checkedUnit").value.trim(),
    answers: answers,
    total: s.total,
    pass: s.pass,
    fail: s.fail,
    na: s.na,
    rate: s.rate,
    conclusion: s.conclusion,
    remark: document.getElementById("remark").value.trim(),
    signInspector: document.getElementById("signInspector").value.trim(),
    signInspectorDate: document.getElementById("signInspectorDate").value,
    signChecked: document.getElementById("signChecked").value.trim(),
    signCheckedDate: document.getElementById("signCheckedDate").value
  };
}

function saveRecord() {
  const data = collectData();
  if (!data.projectName && !data.checkDate) {
    if (!confirm("工程名称和检查日期都没填，仍要保存吗？")) return;
  }
  const records = loadRecords();
  const key = (data.projectName || "未命名") + "|" + (data.checkDate || "无日期");
  const idx = records.findIndex(r => ((r.projectName || "未命名") + "|" + (r.checkDate || "无日期")) === key);
  data.savedAt = new Date().toISOString();
  if (idx >= 0) records[idx] = data;
  else records.unshift(data);
  saveRecords(records);
  renderHistory();
  alert("已保存：" + (data.projectName || "未命名") + " · " + (data.checkDate || "无日期"));
}

function newRecord() {
  if (!confirm("新建会清空当前表单，是否继续？（已保存的记录不会丢）")) return;
  applySiteInfo();
  document.getElementById("remark").value = "";
  document.getElementById("signInspector").value = "";
  document.getElementById("signInspectorDate").value = "";
  document.getElementById("signChecked").value = "";
  document.getElementById("signCheckedDate").value = "";
  CHECK_ITEMS.forEach((_, i) => {
    const checked = document.querySelector(`input[name="item${i}"]:checked`);
    if (checked) checked.checked = false;
  });
  updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function loadRecords() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}
function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function renderHistory() {
  const records = loadRecords();
  const list = document.getElementById("historyList");
  if (records.length === 0) {
    list.innerHTML = '<div class="empty-history">暂无历史记录</div>';
    return;
  }
  list.innerHTML = records.map((r, i) => {
    const rate = r.rate || 0;
    let rateCls = "rate";
    if (rate < 70) rateCls = "rate bad";
    else if (rate < 90) rateCls = "rate mid";
    return `
      <div class="history-item">
        <div class="info">
          <div class="name">${escapeHtml(r.projectName || "未命名")} · ${escapeHtml(r.checkDate || "无日期")}</div>
          <div class="meta-line">
            检查人：${escapeHtml(r.inspector || "—")} · 受检单位：${escapeHtml(r.checkedUnit || "—")}
          </div>
        </div>
        <div class="${rateCls}">${rate.toFixed(1)}% ${r.conclusion || ""}</div>
        <div class="actions">
          <button class="open" onclick="openRecord(${i})">打开</button>
          <button class="del" onclick="deleteRecord(${i})">删除</button>
        </div>
      </div>
    `;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function openRecord(i) {
  const records = loadRecords();
  const r = records[i];
  if (!r) return;
  document.getElementById("projectName").value = r.projectName || "";
  document.getElementById("checkDate").value = r.checkDate || "";
  document.getElementById("inspector").value = r.inspector || "";
  document.getElementById("checkedUnit").value = r.checkedUnit || "";
  document.getElementById("remark").value = r.remark || "";
  document.getElementById("signInspector").value = r.signInspector || "";
  document.getElementById("signInspectorDate").value = r.signInspectorDate || "";
  document.getElementById("signChecked").value = r.signChecked || "";
  document.getElementById("signCheckedDate").value = r.signCheckedDate || "";
  CHECK_ITEMS.forEach((_, idx) => {
    const val = r.answers[idx] || "";
    document.querySelectorAll(`input[name="item${idx}"]`).forEach(inp => {
      inp.checked = (inp.value === val);
    });
  });
  updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteRecord(i) {
  if (!confirm("确定删除这条记录？删除后不可恢复。")) return;
  const records = loadRecords();
  records.splice(i, 1);
  saveRecords(records);
  renderHistory();
}

function exportPDF() {
  const data = collectData();
  if (!data.projectName && !data.checkDate) {
    if (!confirm("工程名称和检查日期都没填，仍要导出吗？")) return;
  }
  const oldTitle = document.title;
  const fileName = (data.projectName || "TY4") + "_" + (data.checkDate || "无日期");
  document.title = fileName;
  setTimeout(() => {
    window.print();
    document.title = oldTitle;
  }, 100);
}

renderItems();
applySiteInfo();
if (!document.getElementById("checkDate").value) {
  document.getElementById("checkDate").value = new Date().toISOString().slice(0, 10);
}
if (!document.getElementById("signInspectorDate").value) {
  document.getElementById("signInspectorDate").value = new Date().toISOString().slice(0, 10);
}
if (!document.getElementById("signCheckedDate").value) {
  document.getElementById("signCheckedDate").value = new Date().toISOString().slice(0, 10);
}
updateStats();
renderHistory();
</script>

</body>
</html>
