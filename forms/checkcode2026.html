<script>
const data = [
  {code:"A01", desc:"无票作业。未按规定办理线路、配电第一、二种工作票、厂站第一、二、三种工作票、带电作业工作票、紧急抢修工作票、检修申请单、动火工作票、书面布置记录票、二次措施单、施工作业票开展现场作业。", type:"两票文件", target:"工作负责人、作业人员", ban:"第七条：严禁未经批准作业、违规无票工作、违规无监护操作、违规解锁。", remark:""},

  {code:"A08", desc:"未有效装设接地线、个人保安线。在因交叉跨越、平行或邻近高压带电线路、设备可能产生感应电压的电力线路或设备上作业时，未加装防感应电个人保安线或接地线；或用于防反送电、防感应电的接地线或个人保安线丧失接地保护功能，如采用缠绕的方法进行接地、与检修电力线路、设备电气直接相连部位未去除油漆或绝缘层、成组接地线遗漏1相及以上未装设（不含接地线夹松脱情形）等。", type:"人员行为", target:"相关人员", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:"修订，增加了丧失接地保护功能的说明。"},
  {code:"A09", desc:"架拆导线未落实防护导线滑脱保护措施。跨越、邻近带电线路架设、拆除导（地）线施工时，未制定及落实防止导（地）线脱落、滑跑、反弹的保护措施。", type:"人员行为", target:"工作负责人、作业人员", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:""},
  {code:"A10", desc:"与带电体安全距离不足。现场工作中，工作人员或机具与高压带电体不能保持规定的安全距离且未采取有效措施，如：在多回线路杆塔进行非带电作业时进入带电侧横担；被砍树木与带电运行的线路安全距离不足且未采取控制树木倾倒方向或未采用绝缘隔离等防护措施；在带电设备附近进行吊装作业时，安全距离不够且未采取有效措施；试验中的高压引线及高压带电部件与周围人员的距离小于规定的安全距离；擅自打开带电开关柜的前、后盖板、静触头绝缘挡板等隔离装置，或超越安全遮栏（围栏）开展工作。", type:"人员行为", target:"工作负责人、作业人员", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:""},
  {code:"A11", desc:"擅自扩大工作范围。擅自扩大工作票所列工作范围开展工作，且安全措施不满足要求。", type:"人员行为", target:"工作负责人、作业人员", ban:"第七条：严禁未经批准作业、违规无票工作、违规无监护操作、违规解锁。", remark:""},
  {code:"A13", desc:"闭锁装置违规解锁。违规使用解锁钥匙或采用非常规解锁用具，擅自解除设备的电气闭锁装置或机械闭锁装置。", type:"人员行为", target:"操作人员、操作监护人", ban:"第七条：严禁未经批准作业、违规无票工作、违规无监护操作、违规解锁。", remark:""},
  {code:"A14", desc:"未经许可或授权擅自操作刀闸或接地线。在设备试验、检修工作中，工作班人员擅自操作未经运行人员许可或授权操作的隔离开关或接地刀闸（接地线）。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"A15", desc:"带负荷断、接引线。在高压带电作业中，带负荷断、接引线；未采取消弧措施带电断、接空载电缆线路的连接引线。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"A16", desc:"约时停、送电。", type:"人员行为", target:"操作人", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:""},
  {code:"A17", desc:"无特种作业证作业。特种作业人员、特种设备作业人员未取得或持假冒的特种作业操作证、特种设备作业人员证从事相应工作。", type:"人员行为", target:"工作负责人、作业人员", ban:"第六条：严禁未经安全教育培训并考试合格的人员上岗作业。", remark:""},
  {code:"A18", desc:"杆塔上有人作业时违规进行拉线调整、架拆导线等。杆塔线路进行机械牵引、展放作业时，安排人员登杆作业（检查及调整放线滑车预偏除外），或线路杆塔上有人作业时，下方人员进行杆塔拉线的调整、拆除，以突然剪断导线、地线、拉线等方法进行松线、撤杆塔。", type:"人员行为", target:"工作负责人、作业人员", ban:"第九条：严禁未落实防坠落、防倒杆措施开展高处作业。", remark:"修订，调整描述。"},
  {code:"A19", desc:"高处作业失去保护。高处作业（含高度超过1.5米且没有栏杆的脚手架工作、工作面边沿或开口处无任何防护设施或防护设施不能满足防护要求的临空状态下进行的高处作业）未使用安全带等防坠落用品、装置，或安全带未挂在牢固的构件上，或攀登杆塔、转移位置时失去安全带的保护。", type:"机具防护", target:"作业人员", ban:"第九条：严禁未落实防坠落、防倒杆措施开展高处作业。", remark:"修订，增加“工作面边沿或开口处无任何防护设施或防护设施不能满足防护要求的临空状态下进行的高处作业”情形。"},
  {code:"A20", desc:"有限空间作业未严格执行“先通风、再检测、后作业”。进入主变等设备内部、事故油池、消防水池、电缆隧道、电缆井、综合管廊、箱涵、深基坑、风机管道等存在自然通风不良，易造成有毒有害、易燃易爆物质积聚或氧含量不足情况的有限空间工作未严格执行“先通风、再检测、后作业”、作业过程中未执行“实时监测、持续通风”要求。", type:"作业环境", target:"工作负责人、作业人员、有关监理人员", ban:"", remark:""},
  {code:"A21", desc:"动火作业安全措施未落实。带明火进入易燃易爆物品储放场所，或在易燃易爆物品储放场所动火工作未采取防火等安全措施，动火作业点10米内未清除可燃物品或作业后现场有残留火种。", type:"作业环境", target:"工作负责人", ban:"", remark:""},
  {code:"A23", desc:"未经安规考试合格上岗作业。现场作业人员（新员工、转岗未经考核合格人员、实习人员和临时作业人员除外）未经安规考试合格即上岗作业。", type:"人员行为", target:"作业人员", ban:"第六条：严禁未经安全教育培训并考试合格的人员上岗作业。", remark:""},
  {code:"A25", desc:"特种设备、机械设备使用不当。使用无证、未按规定检验或检验不合格的特种设备，违规使用起重设备载人作业（合法自制设备除外），或未经计算、验证、检验、审批等程序违规使用自制高空作业平台、吊篮（吊笼）载人作业。", type:"人员行为", target:"使用人员", ban:"第十条：严禁不正确配备或使用不合格的生产用具。", remark:""},
  {code:"A26", desc:"带电作业人员串入电路。不同电位作业人员直接相互接触，作业人员同时接触两个非连通的带电体、作业人员同时接触带电体与接地体，同时安装或拆除不同电位的绝缘遮蔽，绝缘斗臂车或绝缘平台双人带电作业时，同时在不同相或不同电位作业、安全距离不足时作业人员未采取绝缘遮蔽措施等。", type:"人员行为", target:"使用人员", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:""},
  {code:"B01", desc:"无计划作业。未按照规定制定作业计划；或作业计划未按要求录入信息系统（符合规定允许系统补录的且在作业前已确定作业时间、地点、内容及人员并完成审批的作业计划除外），“体外循环”。", type:"两票文件", target:"相关人员", ban:"第七条：严禁未经批准作业、违规无票工作、违规无监护操作、违规解锁。", remark:"修订，增加了对于补录计划的排除情形。"},
  {code:"B02", desc:"工作票关键内容缺失或错误。工作票主要安全措施（开关、刀闸、接地）遗漏、错误，或停电线路、工作地点、工作任务、设备名称编号错误。", type:"两票文件", target:"工作负责人、工作票签发人、工作票会签人", ban:"", remark:""},
  {code:"B03", desc:"操作票关键内容缺失或错误。操作票所列操作任务与操作票不相符，现场设备（设备状态、设备名称编号）错误，断合开关、拉合刀闸以及开关、刀闸位置检查、验电、装拆接地线（拉合接地刀闸）、投退保护压板（软压板）等主要操作项目错项、漏项或顺序原则错误。", type:"两票文件", target:"操作人、操作监护人、值班负责人", ban:"", remark:""},
  {code:"B04", desc:"未开展现场勘察及安全交底（交代）。需开展现场勘察的工作未开展现场勘察。工作负责人未参加现场勘察，设备运维单位或项目管理单位未随同施工单位进行现场勘察、未对施工单位进行安全技术交底。工作许可人在许可前，未对工作负责人进行安全交代。", type:"信息传递", target:"设备运行单位人员、项目管理单位人员、工作许可人", ban:"", remark:"修订，将原C08中的“需开展现场勘察的工作未开展现场勘察”以及“工作负责人、设备运维单位等相关人员未参加现场勘察”的情形提级到B04。"},
  {code:"B05", desc:"安全交代落实不到位。现场开始工作前，工作负责人未向全体工作班人员或分组负责人宣读工作票、施工作业票，未明确交代工作任务及分工、作业地点及范围、作业环境及风险、安全措施及注意事项等。作业人员未经工作负责人（分组负责人或监护人）同意，未参加工作负责人组织的现场安全交代，或不清楚工作任务、危险点，擅自开始或参与工作。", type:"信息传递", target:"工作负责人、作业人员", ban:"", remark:"修订，补充了施工作业票，增加“厂站二次措施单见证人未列入二次措施单所属工作票的工作班成员中”的情形。"},
  {code:"B06", desc:"擅自变更作业人员或工作内容。工作负责人擅自安排、指派工作票、施工作业票所列工作班人员之外的其他人员参与作业；工作票、施工作业票工作人员变更未履行变更手续；厂站二次措施单见证人未列入二次措施单所属工作票的工作班成员中。无需变更调度或设备运维单位的安全措施增加工作内容未按规定办理变更手续。", type:"信息传递", target:"工作负责人", ban:"", remark:""},
  {code:"B07", desc:"未按规定办理工作终结。工作班成员还在工作或还未完全撤离工作现场就办理工作终结手续。全部作业结束后，工作布置的安全措施未拆除或未恢复至作业前状态或工作许可人指定的状态；或作业人员撤离现场后，擅自返回工作地点，继续工作或清理工具、遗留物。", type:"信息传递", target:"工作负责人、作业人员", ban:"", remark:""},
  {code:"B10", desc:"现场作业人员资质不符合要求。现场作业人员存在未经实际技能考核合格、未持证上岗、因违章取消或暂停现场作业资质等不具备相应现场作业资格的情况。工作票中相关“三种人”不具备规定的资格要求。", type:"人员行为", target:"相关人员", ban:"第六条：严禁未经安全教育培训并考试合格的人员上岗作业。", remark:""},
  {code:"B12", desc:"操作票所列人员不具备相应资格。", type:"人员行为", target:"相关人员", ban:"", remark:""},
  {code:"B13", desc:"在变电站、发电厂等生产运行区域超速、无证驾驶机动车。", type:"人员行为", target:"相关人员", ban:"第十条：严禁不正确配备或使用不合格的生产用具。", remark:""},
  {code:"B14", desc:"交叉跨越施工未搭设跨越架等安全措施。交叉跨越各种带电电力线路、铁路、铺装路面公路、河流等放线、撤线时，未采取搭设跨越架、封航、封路等安全措施。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"B15", desc:"接地线装设不牢固不合格未可靠装设接地线。在检修电力线路、设备上装设的工作接地线、系统接地线或个人保安线接地线失灵脱落，或接地体（含临时接地体埋深）不满足安规要求。", type:"人员行为", target:"作业人员", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:"修订，调整描述。"},
  {code:"B16", desc:"临近带电体违规使用金属（或非绝缘）机具。采用钢卷尺、皮卷尺、线尺（夹有金属丝者）或其它金属尺具在厂站、配电房、配电开关站邻近无绝缘隔离措施的带电部位进行测量工作或者测量带电线路导线的弛度、档距及导线与通道内其他物体（交叉跨越、建筑物、树木、塔材等）距离。高压配电线路带电立、撤杆作业时，未使用绝缘绳索控制电杆起立。在厂站、配电房、配电开关站的带电区域内或邻近带电线路附近使用金属梯子进行作业。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"B17", desc:"电力线路设备拆除后，带电部分未处理。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"B18", desc:"未按操作步骤进行操作。未按照操作票操作项目顺序进行操作，存在倒项、添项、漏项、跳项(安规允许的情形除外)。", type:"人员行为", target:"操作人、操作监护人", ban:"", remark:""},
  {code:"B19", desc:"违规无监护操作、无监护工作。执行监护操作时，未按规定履行操作监护程序而独自操作。动火作业、带电作业、搭设跨越架等《安规》规定需设置专人监护的作业未按照要求设置专人监护或监护不到位。", type:"人员行为", target:"操作人", ban:"第七条：严禁未经批准作业、违规无票工作、违规无监护操作、违规解锁。", remark:"修订，原C37合并至B19。"},
  {code:"B20", desc:"防倒杆塔技术措施落实不到位。杆塔组立或组塔架线前，未校核拉线、地锚、索道受力情况，未全面检查或超载荷使用工器具，未紧固地脚螺栓或者地脚螺栓未经验收合格。撤杆塔、撤线或紧线前，未按规定采取防倒杆塔措施。杆塔组立后杆根、塔基未完全牢固或做好拉线即登杆塔作业。在线路杆塔发生基础松弛、塌陷，拉线失效，杆体严重歪斜、上拔，塔材、钢筋变形、断裂，导线断股，金具断裂等严重问题时，未采取可靠安全措施即登杆塔开展作业。", type:"人员行为", target:"工作负责人、作业人员", ban:"第九条：严禁未落实防坠落、防倒杆措施开展高处作业。", remark:""},
  {code:"B22", desc:"未落实防误登杆塔措施开展作业。登杆塔前未核对线路名称、杆塔号、色标，杆塔号缺失的未做临时标记。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"B23", desc:"电气操作未按规定使用绝缘安全工器具。用绝缘棒拉合隔离开关、经传动机构拉合隔离开关和断路器、跌落式熔断器、高压验电，对厂站设备、配电网设备装拆接地线时未戴绝缘手套；装卸高压熔断器熔管，未戴绝缘手套，未站在绝缘物上或未穿绝缘靴。雷雨天气及一次设备发生接地时，未穿绝缘靴巡视厂站内室外高压设备；雨天在户外操作电气设备时，验电器、绝缘棒、操作杆无防雨罩，未穿绝缘靴、戴绝缘手套。", type:"机具防护", target:"作业人员", ban:"", remark:""},
  {code:"B25", desc:"未落实安全措施即进入水力发电机内部工作。进入水力发电机的蜗壳、尾水管等危险部位时未按规定做好关闭阀门、切断操作能源、排空积水等安全措施。", type:"人员行为", target:"作业人员", ban:"", remark:"修订，原C98合并至B25。根据当前推广使用低压现场作业防护手套的要求，补充了未使用的情形。"},
  {code:"B26", desc:"低压不停电作业绝缘防护措施未落实。低压不停电作业未穿绝缘鞋，未戴低压绝缘手套、帆布手套或低压现场作业防护手套，未使用有绝缘柄的工具，未戴护目镜或防护面罩。进行低压不停电作业前未采取绝缘隔离、遮蔽裸露带电部分等防止相间或接地短路的有效措施。", type:"机具防护", target:"作业人员", ban:"", remark:""},
  {code:"B27", desc:"带电试验、二次回路作业绝缘防护不到位。对电缆（或试验设备）进行放电及更换试验引线时，未戴绝缘手套。在带电的电流互感器二次回路上进行拆、接线工作时，未穿绝缘鞋或站在绝缘物上。", type:"机具防护", target:"作业人员", ban:"", remark:""},
  {code:"B29", desc:"牵引工具未按规定接地。邻近带电设备场所使用的起重机和绞车等牵引工具未接地，作业的导（地）线未在工作地点接地。牵引机及张力机出线端的牵引绳及导线上未装设接地滑车。", type:"机具防护", target:"工作负责人", ban:"", remark:"修订，调整描述。"},
  {code:"B31", desc:"未按规定整定定值。未按电力调度规程整定继电保护、调度自动化、安全自动装置的定值。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"B32", desc:"货运索道载人或超载使用，或使用安全保护装置有缺陷的载人提升设备。", type:"机具防护", target:"使用人员", ban:"", remark:""},
  {code:"B33", desc:"特种作业人员未经年审或证件过期仍开展特种作业。", type:"人员行为", target:"作业人员", ban:"第六条：严禁未经安全教育培训并考试合格的人员上岗作业。", remark:"修订，依据国家应急部最新规定，自2026年6月1日起，特种证取消3年复审的规定，只需满6年换证。"},
  {code:"B34", desc:"乘坐船舶或水上作业不使用救生装备。", type:"机具防护", target:"作业人员", ban:"", remark:""},
  {code:"B35", desc:"超负荷作业、超承载能力承接工程。", type:"信息传递", target:"相关人员", ban:"第一条：严禁在安全生产条件不具备情况下组织生产。", remark:""},
  {code:"B36", desc:"未开站班会，或站班会安全技术交底等“三交”“三查”工作与现场安全保障措施、工作任务等严重不符（基建领域专用）。", type:"两票文件", target:"工作负责人", ban:"", remark:""},
  {code:"B37", desc:"二次措施单与现场不符合。", type:"两票文件", target:"工作负责人", ban:"", remark:""},
  {code:"B38", desc:"未按要求验电。未使用相应电压等级且合格的验电器进行验电。对同杆塔架设的多层、同一横担多回线路验电时，未按先验低压，后验高压，先验下层，后验上层，先验近侧，后验远侧的顺序验电。使用低压测电笔对被验电设备的低压部分验电时未与设备的高压部分保持足够的安全距离。", type:"人员行为", target:"作业人员", ban:"", remark:"修订，增加“使用低压测电笔对被验电设备的低压部分验电时未与设备的高压部分保持足够的安全距离”的情形。"},
  {code:"B39", desc:"开挖作业未落实运行线路基础保护措施。在临近运行线路进行基础开挖施工时，未采取防止开挖对运行线路基础造成破坏的措施（对运行线路基础加固开挖除外）。", type:"人员行为", target:"现场负责人", ban:"", remark:""},
  {code:"B40", desc:"公路施工未落实交通安全措施。在高速公路、一级公路等车流量较大的公路施工时，未在工作场所周围装设遮栏（围栏），未设置警示标志，夜间未设置警示光源，未派专人看守。", type:"人员行为", target:"现场负责人", ban:"", remark:""},
  {code:"B41", desc:"醉酒、酒后等不清醒状态下开展作业。", type:"人员行为", target:"工作负责人、作业人员", ban:"", remark:""},
  {code:"B43", desc:"作业现场使用、携带的生产用具不合格。使用不合格（存在严重破损、裂纹、松脱、断股等明显缺陷或达到报废标准）或国家、公司已明令淘汰的安全带、验电器、接地线、绝缘手套、绝缘操作棒、绝缘梯等安全工器具；高压带电作业使用的绝缘工具（绝缘后备保护绳、导电鞋、屏蔽服、手套等）受潮后未重新检测绝缘继续使用；1类手持式电动工具、可移式电动工具、移动发电机、高压试验设备金属外壳未接地或裸露导电部分未装设安全保护罩；砂轮机、切割机、圆锯机、角磨机的刀片有裂纹、破损，或机械转动部分保护罩严重破损、缺失；动力机具的转动部分、冷却风扇缺少保护罩。", type:"机具防护", target:"相关人员", ban:"第十条：严禁不正确配备或使用不合格的生产用具。", remark:"修订，增加“高压带电作业使用的绝缘工具（绝缘后备保护绳、导电鞋、屏蔽服、手套等）受潮后未重新检测绝缘继续使用”的情形。"},
  {code:"B45", desc:"未按规定搭设脚手架。悬挑式、落地式作业脚手架材质不符合规格要求，未设置剪刀撑（或斜撑），脚手架底部未装设纵向和横向扫地杆，2米及以上的作业层未铺设脚手板、作业层外侧未采用安全网；悬挑式、6米及以上落地式作业脚手架未设置连墙件。", type:"机具防护", target:"相关人员", ban:"第九条：严禁未落实防坠落、防倒杆措施开展高处作业。", remark:"修订，调整描述。"},
  {code:"B46", desc:"危大工程方案编制审批实施不到位。超过一定规模的危险性较大分部分项工程未建立工程清单，或未组织编制专项施工方案，或专项方案未按规定论证、审核、审批、交底及现场监督实施，或擅自改变审批专项方案工序方法进行施工。", type:"两票文件", target:"管理人员、现场负责人", ban:"", remark:""},
  {code:"B47", desc:"未严格执行调度令。不执行或无故拖延执行调度命令。", type:"人员行为", target:"受令人、操作人", ban:"第二条：严禁违章指挥、违章作业、违反劳动纪律和调度纪律。", remark:""},
  {code:"B48", desc:"未履行专职监护职责。在可能存在交叉、间歇带电的设备上作业，或在一个电气部分进行多专业协同作业时，工作负责人未履行专职监护职责或直接参与现场作业。", type:"人员行为", target:"工作负责人", ban:"第七条：严禁未经批准作业、违规无票工作、违规无监护操作、违规解锁。", remark:""},
  {code:"B49", desc:"绞磨或卷扬机放置不平稳或锚固不可靠，如利用树木或外露岩石作牵引、制动等主要受力锚桩。", type:"人员行为", target:"使用人员", ban:"", remark:""},
  {code:"B50", desc:"直接接触或穿越绝缘导线作业。直接接触运行中的高压架空绝缘导线、穿越未停电接地或未采取绝缘隔离措施的高压绝缘导线进行工作。", type:"人员行为", target:"工作负责人、作业人员", ban:"第八条：严禁未按规定落实停电、验电、接地等防触电措施开展作业。", remark:""},
  {code:"B53", desc:"劳务分包人员担任施工班组长。", type:"人员行为", target:"相关人员", ban:"第三条：严禁使用不具备规定资质和安全生产保障能力的承包商。", remark:""},
  {code:"B55", desc:"作业车辆防倾覆措施未落实。采用汽车吊、随车吊、高空作业车、绝缘斗臂车、高处作业平台、混凝土臂架泵车等作业时，整机超出安全倾斜角度，或在松软地面、在有沟、坑的未平整地面未落实稳固支撑等防倾覆措施。", type:"人员行为", target:"相关人员", ban:"", remark:""},
  {code:"B101", desc:"现场作业时未按规定着装。", type:"机具防护", target:"作业人员", ban:"", remark:"原C56条款，提级管控。"},
  {code:"B102", desc:"不按规定佩戴或未正确佩戴安全帽。", type:"机具防护", target:"作业人员", ban:"", remark:"原C57条款，提级管控。"},
  {code:"B103", desc:"未按规定将作业纳入视频监控（含视频点不足、故意遮挡视频、非可调摄像头未对准作业现场、位置摆放错误）。", type:"信息传递", target:"相关人员", ban:"", remark:"原C87条款，提级管控。"},
  {code:"B104", desc:"应纳入视频管控作业的现场视频不规范（非硬件原因导致的视频与作业时长不符，未全过程记录；可调节的摄像头未对准现场或者作业人员、应上传的作业视频未及时上传等情况）。", type:"信息传递", target:"相关人员", ban:"", remark:"原D07条款，提级管控。"},
  {code:"C01", desc:"工作票、施工作业票的签发人同时兼任该项工作的工作负责人，或签发空白工作票、施工作业票。", type:"两票文件", target:"工作票签发人", ban:"", remark:""},
  {code:"C02", desc:"工作票、操作票、施工作业票、现场勘察及安全技术交底记录等作业文件存在签名漏签、事后补签、违规代签现象。", type:"两票文件", target:"相关人员", ban:"", remark:"修订，补充了施工作业票。"},
  {code:"C03", desc:"工作负责人未履行临时变更或交接手续离开作业现场。", type:"两票文件", target:"工作负责人", ban:"", remark:""},
  {code:"C04", desc:"工作票不按规定办理延期、间断手续。", type:"两票文件", target:"工作负责人", ban:"", remark:""},
  {code:"C05", desc:"工作票存在工作地点或工作任务不清晰、工作票附属单不齐全。", type:"两票文件", target:"工作负责人、工作票签发人、工作票会签人", ban:"", remark:""},
  {code:"C06", desc:"一份现场电气操作票存在两个及以上操作任务，或操作任务描述不准确。", type:"两票文件", target:"操作人、操作监护人、值班负责人", ban:"", remark:""},
  {code:"C07", desc:"工作负责人违规持有两张及以上工作票同时组织开展工作（安规允许的情况除外）。", type:"两票文件", target:"工作负责人", ban:"", remark:""},
  {code:"C08", desc:"现场勘察及安全技术交底记录与现场不一致；未留存勘察记录。", type:"两票文件", target:"工作负责人、相关人员", ban:"", remark:"修订，原C08中的“需开展现场勘察的工作未开展现场勘察”以及“工作负责人、设备运维单位等相关人员未参加现场勘察”的情形已提级到B04。"},
  {code:"C09", desc:"未开展风险评估、风险识别不全面或风险评估定级错误。未按规定制定风险管控措施或风险控制措施无效、失效。", type:"两票文件", target:"现场负责人", ban:"", remark:""},
  {code:"C10", desc:"装、拆接地线后未及时做好相关记录。", type:"两票文件", target:"相关人员", ban:"", remark:""},
  {code:"C12", desc:"砍伐树木过程中，未采取防止树枝跌落导线及砸伤人员的措施。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"C13", desc:"在高处作业地点的垂直下方及坠物可能落到的地方通行或逗留，高处作业人员随手下上抛掷工具、器具和材料。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C14", desc:"放线、紧线与撒线作业时，工作人员站或跨在已受力的牵引绳、导（地）线的内侧侧及正上方、牵引绳或架空线的垂直下方、导（地）线及牵引绳圈内。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C15", desc:"高边坡施工未按要求设置安全防护设施；对不良地质构造的高边坡，未按设计要求采取锚喷或加固等支护措施。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"C16", desc:"现场坑、沟、孔洞、临边、临时道路、桩基础等施工区域、模板拆除区域未按规定设置盖板或防止外人通行的围栏、警示标志。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"C17", desc:"起吊作业范围没有防止外人通行的围蔽设施、未设置警示标志。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"C18", desc:"在城区、人口密集区、通行道路上或交通道口施工时，工作场所周围未设遮栏（围栏）或其他安全措施。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"C19", desc:"漏填写、漏装（拆）、错装（拆）工作票所列安全措施中的标志牌、安全遮栏（围栏）。", type:"人员行为", target:"工作许可人、工作负责人", ban:"", remark:""},
  {code:"C20", desc:"高压试验现场未装设遮栏，或遮栏与试验设备高压部分未保持足够的安全距离，或未向外悬挂“止步，高压危险！”标志牌。", type:"人员行为", target:"工作负责人", ban:"", remark:""},
  {code:"C22", desc:"施工检修电源箱外壳未接地或接地不规范、无锁、无警示标志等。变压器、电抗器在放油及滤油过程中，储油罐和油处理设备未可靠接地。", type:"人员行为", target:"使用人员", ban:"", remark:""},
  {code:"C23", desc:"随意挪用或损坏现场安全标志等各类安全设施。", type:"人员行为", target:"相关人员", ban:"", remark:""},
  {code:"C24", desc:"作业人员擅自移动安全遮栏（围栏）、拆除标志牌等。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C25", desc:"擅自拆除孔洞盖板、栏杆、隔离层，或因工作需要拆除附属设施时未设明显标示，未及时恢复。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C26", desc:"运行值班人员未经批准擅自离开运行值班岗位。", type:"人员行为", target:"值班人员", ban:"", remark:""},
  {code:"C27", desc:"作业人员擅自穿、跨越安全遮栏（围栏）或超越安全警戒线开展工作。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C28", desc:"电容器、电缆等设备检修前或试验调整接线前，未逐个、逐相进行充分放电。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C29", desc:"作业人员在受力钢丝绳上下方、内角侧，或起吊物下逗留或通过。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C30", desc:"将运行中转动设备的防护罩打开，或将手伸入运行中转动设备的遮栏内。戴手套或用抹布对转动部分进行清扫或进行其他工作。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C31", desc:"攀爬脆弱或枯死的树枝和已经锯过或砍过未断的树枝。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C32", desc:"不按规定顺序装、拆接地线。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C33", desc:"电气设备移动、收放电源线时未切断电源。", type:"人员行为", target:"作业人员", ban:"", remark:""},
  {code:"C34", desc:"操作时未执行唱票复诵制度。", type:"信息传递", target:"操作人、操作监护人", ban:"", remark:""},
  {code:"C35", desc:"工作负责人在工作内容、分工、范围等变动后，未重新组织工作班人员进行安全交代。", type:"信息传递", target:"工作负责人", ban:"", remark:""},
  {code:"C36", desc:"建设单位、施工单位、监理单位等管理人员未按作业风险管控规定履职管控。", type:"信息传递", target:"相关人员", ban:"", remark:""},
  {code:"C38", desc:"高压试验加压过程未进行监护和呼唱，变更接线或试验结束时未将升压设备的高压部分放电、短路接地。", type:"信息传递", target:"作业人员", ban:"", remark:""},
  {code:"C39", desc:"起吊作业进行中，操作人员离开操作台、室，指挥人员离开现场，或指挥信息不清晰、不畅通。", type:"信息传递", target:"指挥人员、操作人员", ban:"", remark:""},
  {code:"C40", desc:"搬运、起吊重大物件无统一指挥、统一信号。", type:"信息传递", target:"工作负责人", ban:"", remark:""},
  {code:"C41", desc:"电源箱设置不符合“一机、一闸、一保护”要求，临时电源箱无漏电保护装置或漏电装置损坏，或插头、插座、电源箱破损明显，或使用铁线、铜线等代替保险丝。", type:"机具防护", target:"使用人员", ban:"", remark:""},
  {code:"C42", desc:"电气设备、工具的电源线直接钩挂在闸刀上或直接插入插座使用。", type:"机具防护", target:"作业人员", ban:"", remark:""},
  {code:"C43", desc:"雨雪天户外露天使用电焊机，或电焊机电源线直接搭接在电线上。", type:"机具防护", target:"使用人员", ban:"", remark:""},

const STORAGE_KEY = "violation_general_records";
const SITE_INFO_KEY = "site_check_info";

let checkedCodes = new Set();

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const typeEl = document.getElementById("typeFilter");
const statusEl = document.getElementById("statusFilter");
const levelEl = document.getElementById("levelFilter");
const checkedCountEl = document.getElementById("checkedCount");

document.getElementById("totalCount").textContent = data.length;

/* ============ 从 index 读取信息 ============ */
function loadSiteInfo() {
  try {
    const raw = localStorage.getItem(SITE_INFO_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function applySiteInfo() {
  const info = loadSiteInfo();
  if (!info) return;
  document.getElementById("projectName").value = info.projectName || "";
  document.getElementById("checkDate").value = info.checkDate || new Date().toISOString().slice(0, 10);
  document.getElementById("inspector").value = info.inspector || "";
  document.getElementById("checkedUnit").value = info.checkedUnit || "";
}

/* ============ 填充类型下拉 ============ */
const types = [...new Set(data.map(d => d.type))].sort();
types.forEach(t => {
  const opt = document.createElement("option");
  opt.value = t;
  opt.textContent = t;
  typeEl.appendChild(opt);
});

function levelOf(code) {
  return code.charAt(0).toUpperCase();
}

/* ============ 渲染 ============ */
function render() {
  const kw = searchEl.value.trim().toLowerCase();
  const tp = typeEl.value;
  const st = statusEl.value;
  const lv = levelEl.value;

  const filtered = data.filter(d => {
    const matchKw = !kw ||
      d.code.toLowerCase().includes(kw) ||
      d.desc.toLowerCase().includes(kw) ||
      d.target.toLowerCase().includes(kw) ||
      (d.ban && d.ban.toLowerCase().includes(kw));
    const matchTp = !tp || d.type === tp;
    const matchLv = !lv || levelOf(d.code) === lv;
    const matchSt = !st ||
      (st === "checked" && checkedCodes.has(d.code)) ||
      (st === "unchecked" && !checkedCodes.has(d.code));
    return matchKw && matchTp && matchLv && matchSt;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">没有匹配的违章条目</div>';
    updateCheckedCount();
    return;
  }

  listEl.innerHTML = filtered.map(d => {
    const lv = levelOf(d.code);
    const checked = checkedCodes.has(d.code) ? "checked" : "";
    return `
    <div class="item level-${lv} ${checked}" data-code="${d.code}" onclick="toggleItem('${d.code}')">
      <div class="body">
        <div class="top">
          <span class="code">${d.code}</span>
          <span class="tag">${d.type}</span>
          <span class="target">扣分：${d.target}</span>
          ${d.ban ? `<span class="ban">${d.ban.split("：")[0]}</span>` : ""}
        </div>
        <div class="desc">${d.desc}</div>
        ${d.ban ? `<div class="remark">安全生产禁令：${d.ban}</div>` : ""}
        ${d.remark ? `<div class="remark">备注：${d.remark}</div>` : ""}
      </div>
      <div class="check-col">
        <div class="box"></div>
      </div>
    </div>
    `;
  }).join("");

  updateCheckedCount();
}

function toggleItem(code) {
  if (checkedCodes.has(code)) checkedCodes.delete(code);
  else checkedCodes.add(code);
  render();
}

function updateCheckedCount() {
  document.getElementById("checkedCount").textContent = checkedCodes.size;
}

/* ============ 构建导出区 ============ */
function buildPrintArea() {
  // 表头信息
  document.getElementById("printProject").textContent =
    document.getElementById("projectName").value.trim() || "—";
  document.getElementById("printDate").textContent =
    document.getElementById("checkDate").value || "—";
  document.getElementById("printInspector").textContent =
    document.getElementById("inspector").value.trim() || "—";
  document.getElementById("printUnit").textContent =
    document.getElementById("checkedUnit").value.trim() || "—";

  // 表格内容：只取勾选的，按原 data 顺序
  const checkedItems = data.filter(d => checkedCodes.has(d.code));

  const tbody = document.getElementById("printBody");
  if (checkedItems.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="print-empty">没有勾选任何不合格项</td></tr>';
  } else {
    tbody.innerHTML = checkedItems.map((d, i) => {
      const codePart = `<span class="print-item-code">${d.code}</span>`;
      const tagPart = `<span class="print-item-tag">${d.type}</span>`;
      const targetPart = `<span class="print-item-target">扣分：${d.target}</span>`;
      const statusPart = `<span class="print-item-status">不合格</span>`;
      const descPart = `<div class="print-item-desc">${d.desc}</div>`;
      const banPart = d.ban ? `<div class="print-item-ban">安全生产禁令：${d.ban}</div>` : "";
      const remarkPart = d.remark ? `<div class="print-item-ban">备注：${d.remark}</div>` : "";
      return `<tr>
        <td class="idx">${i + 1}</td>
        <td>
          <div>${codePart}${tagPart}${targetPart}${statusPart}</div>
          ${descPart}
          ${banPart}
          ${remarkPart}
        </td>
      </tr>`;
    }).join("");
  }

  document.getElementById("printTotal").textContent = `共 ${checkedItems.length} 条`;

  // 备注默认空
  document.getElementById("printRemark").textContent = "";
}

/* ============ 保存 ============ */
function saveRecord() {
  if (checkedCodes.size === 0) {
    alert("请先勾选至少一条不合格项");
    return;
  }
  const dataNow = {
    projectName: document.getElementById("projectName").value.trim(),
    checkDate: document.getElementById("checkDate").value,
    inspector: document.getElementById("inspector").value.trim(),
    checkedUnit: document.getElementById("checkedUnit").value.trim(),
    codes: [...checkedCodes],
    savedAt: new Date().toISOString()
  };
  const records = loadRecords();
  dataNow.key = (dataNow.projectName || "未命名") + "|" + (dataNow.checkDate || "无日期") + "|" + Date.now();
  records.unshift(dataNow);
  saveRecords(records);
  renderHistory();
  alert("已保存：" + checkedCodes.size + " 条不合格项");
}

/* ============ 新建 ============ */
function newRecord() {
  if (!confirm("新建会清空所有勾选，是否继续？（已保存的记录不会丢）")) return;
  checkedCodes.clear();
  applySiteInfo();
  document.getElementById("search").value = "";
  document.getElementById("typeFilter").value = "";
  document.getElementById("statusFilter").value = "";
  document.getElementById("levelFilter").value = "";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============ localStorage ============ */
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

/* ============ 历史记录 ============ */
function renderHistory() {
  const records = loadRecords();
  const list = document.getElementById("historyList");
  if (records.length === 0) {
    list.innerHTML = '<div class="empty-history">暂无历史记录</div>';
    return;
  }
  list.innerHTML = records.map((r, i) => `
    <div class="history-item">
      <div class="info">
        <div class="name">${escapeHtml(r.projectName || "未命名")} · ${escapeHtml(r.checkDate || "无日期")}</div>
        <div class="meta-line">
          检查人：${escapeHtml(r.inspector || "—")} · 受检分部：${escapeHtml(r.checkedUnit || "—")}
        </div>
      </div>
      <div class="count">${(r.codes || []).length} 条</div>
      <div class="actions">
        <button class="open" onclick="openRecord(${i})">打开</button>
        <button class="del" onclick="deleteRecord(${i})">删除</button>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function openRecord(i) {
  const records = loadRecords();
  const r = records[i];
  if (!r) return;
  document.getElementById("projectName").value = r.projectName || "";
  document.getElementById("checkDate").value = r.checkDate || "";
  document.getElementById("inspector").value = r.inspector || "";
  document.getElementById("checkedUnit").value = r.checkedUnit || "";
  checkedCodes = new Set(r.codes || []);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteRecord(i) {
  if (!confirm("确定删除这条记录？删除后不可恢复。")) return;
  const records = loadRecords();
  records.splice(i, 1);
  saveRecords(records);
  renderHistory();
}

/* ============ 导出 PDF ============ */
function exportPDF() {
  if (checkedCodes.size === 0) {
    alert("请先勾选至少一条不合格项");
    return;
  }
  buildPrintArea();
  const proj = document.getElementById("projectName").value.trim() || "未命名";
  const date = document.getElementById("checkDate").value || "无日期";
  const oldTitle = document.title;
  document.title = proj + "_" + date + "_不合格清单";
  setTimeout(() => {
    window.print();
    document.title = oldTitle;
  }, 100);
}

/* ============ 初始化 ============ */
searchEl.addEventListener("input", render);
typeEl.addEventListener("change", render);
statusEl.addEventListener("change", render);
levelEl.addEventListener("change", render);

applySiteInfo();
if (!document.getElementById("checkDate").value) {
  document.getElementById("checkDate").value = new Date().toISOString().slice(0, 10);
}
render();
renderHistory();
</script>

</body>
</html>
