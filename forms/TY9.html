<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TY9 个人防护用品检查评价表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    padding: 12px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  .toolbar {
    background: #1a3a5c;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .toolbar h1 {
    font-size: 16px;
    color: #fff;
    margin-right: auto;
    font-weight: 600;
  }
  .toolbar .back-link {
    color: #b8c7d9;
    font-size: 13px;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
  }
  .btn {
    padding: 8px 14px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    background: #2b6cb0;
    color: #fff;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn.gray { background: #4a5568; }
  .btn.green { background: #2f855a; }

  .sheet {
    background: #fff;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 12px;
  }

  .sheet-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #1a3a5c;
    padding-bottom: 12px;
    border-bottom: 2px solid #1a3a5c;
    margin-bottom: 16px;
  }

  .meta {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .meta .field {
    display: flex;
    align-items: center;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    overflow: hidden;
  }
  .meta .field label {
    background: #f7fafc;
    padding: 9px 10px;
    font-size: 13px;
    color: #4a5568;
    white-space: nowrap;
    border-right: 1px solid #d0d5dd;
    min-width: 78px;
    text-align: center;
  }
  .meta .field input {
    flex: 1;
    border: none;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  @media (max-width: 600px) {
    .meta { grid-template-columns: 1fr; }
  }

  /* 类别选择器 */
  .cat-selector { margin-bottom: 16px; }
  .cat-selector .cs-title {
    font-size: 13px;
    color: #4a5568;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .cat-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cat-btn {
    padding: 8px 14px;
    font-size: 13px;
    border: 1px solid #d0d5dd;
    border-radius: 20px;
    background: #fff;
    color: #4a5568;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    user-select: none;
  }
  .cat-btn:active { transform: scale(0.96); }
  .cat-btn.active {
    background: #2b6cb0;
    color: #fff;
    border-color: #2b6cb0;
    font-weight: 600;
  }

  .check-list {
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    overflow: hidden;
  }
  .check-header {
    background: #1a3a5c;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 8px;
  }
  .check-item {
    padding: 12px;
    border-bottom: 1px solid #e2e8f0;
    background: #fff;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item .row1 {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 8px;
    align-items: flex-start;
  }
  .check-item .idx {
    color: #4a5568;
    font-size: 13px;
    text-align: center;
    padding-top: 2px;
  }
  .check-item .content {
    font-size: 14px;
    line-height: 1.7;
    color: #1a1a1a;
  }
  .check-item .row2 {
    margin-top: 10px;
    padding-left: 50px;
  }
  .opts {
    display: flex;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
    max-width: 360px;
  }
  .opts label {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    font-size: 13px;
    cursor: pointer;
    background: #fff;
    color: #4a5568;
    border-right: 1px solid #d0d5dd;
    transition: all 0.12s;
    user-select: none;
    white-space: nowrap;
  }
  .opts label:last-child { border-right: none; }
  .opts input { display: none; }
  .opts input:checked + label { color: #fff; font-weight: 600; }
  .opts input[value="合格"]:checked + label { background: #2f855a; }
  .opts input[value="不合格"]:checked + label { background: #c53030; }
  .opts input[value="不适用"]:checked + label { background: #718096; }

  @media (max-width: 600px) {
    .check-item .row2 { padding-left: 50px; }
    .opts { max-width: 100%; }
  }

  .empty-hint {
    text-align: center;
    color: #a0aec0;
    font-size: 14px;
    padding: 40px 20px;
    line-height: 1.8;
  }

  .summary {
    margin-top: 16px;
    display: flex;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    overflow: hidden;
    background: #f7fafc;
  }
  .summary .box {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    border-right: 1px solid #d0d5dd;
    min-width: 0;
  }
  .summary .box:last-child { border-right: none; }
  .summary .box .num {
    font-size: 20px;
    font-weight: 700;
    color: #1a3a5c;
    line-height: 1.2;
  }
  .summary .box .lbl {
    font-size: 11px;
    color: #718096;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 480px) {
    .summary .box .num { font-size: 18px; }
    .summary .box .lbl { font-size: 10px; }
  }

  .conclusion {
    margin-top: 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .conclusion .lbl {
    font-size: 14px;
    color: #4a5568;
    font-weight: 600;
  }
  .conclusion .val {
    font-size: 18px;
    font-weight: 700;
  }
  .conclusion .val.you { color: #2f855a; }
  .conclusion .val.hege { color: #2b6cb0; }
  .conclusion .val.buhege { color: #c53030; }

  .remark-box { margin-top: 14px; }
  .remark-box label {
    display: block;
    font-size: 14px;
    color: #4a5568;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .remark-box textarea {
    width: 100%;
    min-height: 70px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    resize: vertical;
    line-height: 1.6;
  }
  .remark-box textarea:focus { border-color: #2b6cb0; }

  .sign-row {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 600px) {
    .sign-row { grid-template-columns: 1fr; }
  }
  .sign-row .sign-field {
    display: flex;
    align-items: center;
    border-bottom: 1px solid #4a5568;
    padding-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .sign-row .sign-field label {
    font-size: 14px;
    color: #4a5568;
    font-weight: 600;
    white-space: nowrap;
    margin-right: 4px;
  }
  .sign-row .sign-field input[type="text"] {
    flex: 1;
    border: none;
    padding: 6px 4px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    background: transparent;
    min-width: 80px;
  }
  .sign-row .sign-field .date-suffix {
    font-size: 13px;
    color: #718096;
    white-space: nowrap;
    margin-left: 6px;
  }
  .sign-row .sign-field input[type="date"] {
    border: none;
    padding: 4px;
    font-size: 13px;
    font-family: inherit;
    background: transparent;
    outline: none;
    color: #4a5568;
    max-width: 140px;
  }

  .history {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .history h2 {
    font-size: 15px;
    color: #1a3a5c;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 4px solid #2b6cb0;
  }
  .history-item {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .history-item .info { flex: 1; min-width: 200px; }
  .history-item .name {
    font-size: 14px;
    font-weight: 600;
    color: #1a3a5c;
  }
  .history-item .meta-line {
    font-size: 12px;
    color: #718096;
    margin-top: 4px;
  }
  .history-item .rate {
    font-size: 14px;
    font-weight: 700;
    color: #2f855a;
    margin-right: 6px;
  }
  .history-item .rate.bad { color: #c53030; }
  .history-item .rate.mid { color: #2b6cb0; }
  .history-item .actions { display: flex; gap: 6px; }
  .history-item .actions button {
    padding: 6px 10px;
    font-size: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    color: #fff;
  }
  .history-item .actions .open { background: #2b6cb0; }
  .history-item .actions .del { background: #c53030; }
  .empty-history {
    text-align: center;
    color: #a0aec0;
    font-size: 13px;
    padding: 24px 0;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .history, .no-print, .cat-selector, .empty-hint { display: none !important; }
    .sheet { box-shadow: none; border-radius: 0; padding: 0; margin: 0; }
    .sheet-title { font-size: 16px; }
    .meta .field label { background: #fff; }
    .check-header {
      background: #e2e8f0 !important;
      color: #1a1a1a !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .check-item .content { font-size: 15px !important; line-height: 1.6 !important; }
    .check-item .idx { font-size: 14px !important; }
    .check-item .row2 { padding-left: 50px !important; margin-top: 6px !important; }
    .opts { max-width: 280px !important; display: flex !important; }
    .opts label {
      flex: 1 !important;
      padding: 4px 4px !important;
      font-size: 11px !important;
      background: #fff !important;
      color: #4a5568 !important;
    }
    .opts input[value="合格"]:checked + label { background: #2f855a !important; color: #fff !important; }
    .opts input[value="不合格"]:checked + label { background: #c53030 !important; color: #fff !important; }
    .opts input[value="不适用"]:checked + label { background: #718096 !important; color: #fff !important; }
    .check-item { padding: 8px 12px !important; }
    .summary { display: flex !important; background: #fff !important; }
    .summary .box { border-right: 1px solid #000 !important; padding: 8px 4px !important; }
    .summary .box:last-child { border-right: none !important; }
    .summary .box .num { font-size: 16px !important; }
    .summary .box .lbl { font-size: 11px !important; color: #333 !important; }
    .conclusion { border: 1px solid #000 !important; padding: 8px 12px !important; }
    .conclusion .val { font-size: 16px !important; }
    .sign-row .sign-field { border-bottom: 1px solid #000; }
    .summary, .conclusion, .remark-box, .sign-row { page-break-inside: avoid; }
    .check-item { page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="toolbar no-print">
    <a class="back-link" href="../index.html">← 返回</a>
    <h1>TY9 个人防护用品检查评价表</h1>
    <button class="btn green" onclick="saveRecord()">保存</button>
    <button class="btn" onclick="exportPDF()">导出 PDF</button>
    <button class="btn gray" onclick="newRecord()">新建</button>
  </div>

  <div class="sheet" id="sheet">

    <div class="sheet-title">TY9 个人防护用品检查评价表</div>

    <div class="meta">
      <div class="field">
        <label>工程名称</label>
        <input type="text" id="projectName" placeholder="可不填">
      </div>
      <div class="field">
        <label>检查日期</label>
        <input type="date" id="checkDate">
      </div>
      <div class="field">
        <label>检查人</label>
        <input type="text" id="inspector" placeholder="可不填">
      </div>
      <div class="field">
        <label>受检分部</label>
        <input type="text" id="checkedUnit" placeholder="可不填">
      </div>
    </div>

    <div class="cat-selector no-print">
      <div class="cs-title">选择检查类别（可多选，不选则不显示）</div>
      <div class="cat-btns" id="catBtns"></div>
    </div>

    <div class="check-list" id="checkListWrap" style="display:none;">
      <div class="check-header">
        <div>序号</div>
        <div>检查评价项目</div>
      </div>
      <div id="checkBody"></div>
    </div>

    <div class="empty-hint" id="emptyHint">
      请在上方选择要检查的类别
    </div>

    <div class="summary">
      <div class="box">
        <div class="num" id="sumTotal">0</div>
        <div class="lbl">检查项总数</div>
      </div>
      <div class="box">
        <div class="num" id="sumPass" style="color:#2f855a;">0</div>
        <div class="lbl">合格项总数</div>
      </div>
      <div class="box">
        <div class="num" id="sumFail" style="color:#c53030;">0</div>
        <div class="lbl">不合格项总数</div>
      </div>
    </div>

    <div class="conclusion">
      <span class="lbl">合格率：</span>
      <span class="val" id="rateVal">0%</span>
      <span class="lbl" style="margin-left:16px;">评价结论：</span>
      <span class="val" id="conclusionVal">—</span>
    </div>

    <div class="remark-box">
      <label>备注 / 检查结果</label>
      <textarea id="remark" placeholder="可手写或输入"></textarea>
    </div>

    <div class="sign-row">
      <div class="sign-field">
        <label>检查人签名：</label>
        <input type="text" id="signInspector" placeholder="">
        <span class="date-suffix">日期：</span>
        <input type="date" id="signInspectorDate">
      </div>
      <div class="sign-field">
        <label>受检人签名：</label>
        <input type="text" id="signChecked" placeholder="">
        <span class="date-suffix">日期：</span>
        <input type="date" id="signCheckedDate">
      </div>
    </div>

  </div>

  <div class="history no-print">
    <h2>历史记录</h2>
    <div id="historyList"></div>
  </div>

</div>

<script>
const CHECK_DATA = [
  {cat:"安全帽", text:"建立管理台帐。"},
  {cat:"安全帽", text:"产品应取得《特种劳动防护用品安全标志证书》，有“产品检验合格证”，厂家名称和有效期。"},
  {cat:"安全帽", text:"按规定在有效期内正确使用安全帽，不得使用擅自改装、损坏的安全帽。"},
  {cat:"安全带", text:"建立管理台帐。"},
  {cat:"安全带", text:"产品应取得《特种劳动防护用品安全标志证书》，并有“产品检验合格证”，生产厂家和许可证编号，生产日期。"},
  {cat:"安全带", text:"在规定的使用期限内使用，新安全带在使用1年后抽样试验，旧安全带每6个月进行一次抽样试验，现场有检验、试验记录。"},
  {cat:"安全带", text:"使用前必须进行外观检查，安全带有（绳）断股、霉变、虫蛀、损伤或铁环有裂纹、挂钩变形、接口缝线脱落等情况时严禁使用。"},
  {cat:"安全带", text:"高处作业人员必须正确使用双保险安全带，且作业地点超过80米的作业人员必须使用全方位防冲击安全带；安全带应高挂和平行拴挂，严禁低挂高用。"},
  {cat:"安全带", text:"安全带使用期为3～5年，发现异常应提前报废。"},
  {cat:"防毒面具", text:"一般防毒面具的防护性能具有专一性，应根据环境中有毒有害气体的性质进行正确选择，不能乱用或混用。"},
  {cat:"防毒面具", text:"在使用防毒面具之前，应进行检查，查看各部位是否完整，查看连接部位是否接好，认真检查气密性。"},
  {cat:"防毒面具", text:"所选用的防毒面具，必须有国家指定的部门鉴定达到技术要求方可使用。"},
  {cat:"绝缘手套", text:"每半年进行一次检验、试验，合格后方可使用，现场有检验、试验记录。"},
  {cat:"绝缘手套", text:"使用前进行外观检查，无外伤、裂纹、漏洞、气泡、毛刺、划痕等缺陷。"},
  {cat:"绝缘手套", text:"佩戴时应将衣袖口套进筒内。"},
  {cat:"绝缘手套", text:"使用后，应将污物擦洗干净，妥善保管防止受潮。"},
  {cat:"绝缘手套", text:"严禁将绝缘手套挪作他用。"},
  {cat:"绝缘手套", text:"从事高压验电、装拆接地线、高压电气试验等有触电危险的作业人员必须佩戴绝缘手套。"},
  {cat:"绝缘鞋", text:"应建立管理台帐，每半年进行一次检验、试验，合格后方可使用。"},
  {cat:"绝缘鞋", text:"使用前进行外观检查，无外伤、裂纹、漏洞、气泡、毛刺、划痕等缺陷。"},
  {cat:"绝缘鞋", text:"使用绝缘鞋（靴）时应将裤管套入鞋筒内。"},
  {cat:"绝缘鞋", text:"避免接触尖锐物体、高温或腐蚀性物质。"},
  {cat:"绝缘鞋", text:"使用后，应将污物擦洗干净，妥善保管防止受潮。"},
  {cat:"绝缘鞋", text:"严禁将绝缘鞋挪作他用。"},
  {cat:"绝缘鞋", text:"从事高压验电、装拆接地线、高压电气试验等有触电危险的作业人员必须穿着绝缘鞋（靴）。"},
  {cat:"导电鞋", text:"穿用过程中，一般不超过200h应进行电阻测试一次。"},
  {cat:"导电鞋", text:"应存放在干燥通风的仓库中，防止霉变。堆放离开地面、墙壁0.2m以上，离开一切发热体1m以外。避免与油、酸、碱类或其他腐蚀性物品接触。"},
  {cat:"登杆脚扣", text:"脚扣试验静拉力为980N，试验时间为5min，试验周期为半年一次，外表检查周期为每月一次。"},
  {cat:"登杆脚扣", text:"脚扣宜放在干燥通风和无腐蚀的场所保存。"},
  {cat:"登高板", text:"登高板绳索必须为一整根，直径不小于18mm多股绞绳或编织绳，踏板和绳均应能承受2205N。"},
  {cat:"登高板", text:"踏板正面应有防滑条纹，其深度不应超过3mm。"},
  {cat:"登高板", text:"绳两端系结在踏板两头的扎结槽内，绳顶端系结铁挂钩，绳的长度应与使用者的身材相适应。"},

const STORAGE_KEY = "TY9_records";
const SITE_INFO_KEY = "site_check_info";
const CATEGORIES = [...new Set(CHECK_DATA.map(d => d.cat))];
let selectedCats = new Set();
let visibleItems = [];

function loadSiteInfo() {
  try {
    const raw = localStorage.getItem(SITE_INFO_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function applySiteInfo() {
  const data = loadSiteInfo();
  if (!data) return;
  document.getElementById("projectName").value = data.projectName || "";
  document.getElementById("checkDate").value = data.checkDate || new Date().toISOString().slice(0, 10);
  document.getElementById("inspector").value = data.inspector || "";
  document.getElementById("checkedUnit").value = data.checkedUnit || "";
  document.getElementById("signInspectorDate").value = data.checkDate || new Date().toISOString().slice(0, 10);
  document.getElementById("signCheckedDate").value = data.checkDate || new Date().toISOString().slice(0, 10);
}

function renderCatButtons() {
  const wrap = document.getElementById("catBtns");
  wrap.innerHTML = CATEGORIES.map(cat =>
    `<button class="cat-btn" data-cat="${cat}" onclick="toggleCat('${cat}')">${cat}</button>`
  ).join("");
}

function toggleCat(cat) {
  if (selectedCats.has(cat)) selectedCats.delete(cat);
  else selectedCats.add(cat);
  document.querySelectorAll(".cat-btn").forEach(btn => {
    if (selectedCats.has(btn.dataset.cat)) btn.classList.add("active");
    else btn.classList.remove("active");
  });
  renderItems();
  updateStats();
}

function renderItems() {
  visibleItems = CHECK_DATA.filter(d => selectedCats.has(d.cat));
  const listWrap = document.getElementById("checkListWrap");
  const emptyHint = document.getElementById("emptyHint");
  const body = document.getElementById("checkBody");
  if (visibleItems.length === 0) {
    listWrap.style.display = "none";
    emptyHint.style.display = "block";
    body.innerHTML = "";
    return;
  }
  listWrap.style.display = "block";
  emptyHint.style.display = "none";
  body.innerHTML = visibleItems.map((item, i) => `
    <div class="check-item">
      <div class="row1">
        <div class="idx">${i + 1}</div>
        <div class="content">【${item.cat}】${item.text}</div>
      </div>
      <div class="row2">
        <div class="opts">
          <input type="radio" name="item${i}" id="item${i}_ok" value="合格" onchange="updateStats()">
          <label for="item${i}_ok">合格</label>
          <input type="radio" name="item${i}" id="item${i}_ng" value="不合格" onchange="updateStats()">
          <label for="item${i}_ng">不合格</label>
          <input type="radio" name="item${i}" id="item${i}_na" value="不适用" onchange="updateStats()">
          <label for="item${i}_na">不适用</label>
        </div>
      </div>
    </div>
  `).join("");
}

function calcStats(answers) {
  let pass = 0, fail = 0, na = 0;
  answers.forEach(a => {
    if (a === "合格") pass++;
    else if (a === "不合格") fail++;
    else if (a === "不适用") na++;
  });
  const total = pass + fail;
  const rate = total > 0 ? (pass / total * 100) : 0;
  let conclusion = "—";
  if (total > 0) {
    if (rate >= 90) conclusion = "优";
    else if (rate >= 70) conclusion = "合格";
    else conclusion = "不合格";
  }
  return { total, pass, fail, na, rate, conclusion };
}

function updateStats() {
  const answers = visibleItems.map((_, i) => {
    const checked = document.querySelector(`input[name="item${i}"]:checked`);
    return checked ? checked.value : "";
  });
  const s = calcStats(answers);
  document.getElementById("sumTotal").textContent = s.total;
  document.getElementById("sumPass").textContent = s.pass;
  document.getElementById("sumFail").textContent = s.fail;
  document.getElementById("rateVal").textContent = s.rate.toFixed(1) + "%";
  const conclusionEl = document.getElementById("conclusionVal");
  if (s.total === 0) { conclusionEl.textContent = "—"; conclusionEl.className = "val"; }
  else if (s.rate >= 90) { conclusionEl.textContent = "优"; conclusionEl.className = "val you"; }
  else if (s.rate >= 70) { conclusionEl.textContent = "合格"; conclusionEl.className = "val hege"; }
  else { conclusionEl.textContent = "不合格"; conclusionEl.className = "val buhege"; }
}

function collectData() {
  const answers = visibleItems.map((_, i) => {
    const checked = document.querySelector(`input[name="item${i}"]:checked`);
    return checked ? checked.value : "";
  });
  const s = calcStats(answers);
  return {
    projectName: document.getElementById("projectName").value.trim(),
    checkDate: document.getElementById("checkDate").value,
    inspector: document.getElementById("inspector").value.trim(),
    checkedUnit: document.getElementById("checkedUnit").value.trim(),
    selectedCats: [...selectedCats],
    visibleItems: visibleItems.map(d => d.cat + "|" + d.text),
    answers: answers,
    total: s.total, pass: s.pass, fail: s.fail, na: s.na,
    rate: s.rate, conclusion: s.conclusion,
    remark: document.getElementById("remark").value.trim(),
    signInspector: document.getElementById("signInspector").value.trim(),
    signInspectorDate: document.getElementById("signInspectorDate").value,
    signChecked: document.getElementById("signChecked").value.trim(),
    signCheckedDate: document.getElementById("signCheckedDate").value
  };
}

function saveRecord() {
  if (visibleItems.length === 0) { alert("请先选择至少一个检查类别"); return; }
  const data = collectData();
  if (!data.projectName && !data.checkDate) {
    if (!confirm("工程名称和检查日期都没填，仍要保存吗？")) return;
  }
  const records = loadRecords();
  const key = (data.projectName || "未命名") + "|" + (data.checkDate || "无日期");
  const idx = records.findIndex(r => ((r.projectName || "未命名") + "|" + (r.checkDate || "无日期")) === key);
  data.savedAt = new Date().toISOString();
  if (idx >= 0) records[idx] = data;
  else records.unshift(data);
  saveRecords(records);
  renderHistory();
  alert("已保存：" + (data.projectName || "未命名") + " · " + (data.checkDate || "无日期"));
}

function newRecord() {
  if (!confirm("新建会清空当前表单，是否继续？（已保存的记录不会丢）")) return;
  applySiteInfo();
  document.getElementById("remark").value = "";
  document.getElementById("signInspector").value = "";
  document.getElementById("signChecked").value = "";
  selectedCats.clear();
  document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("active"));
  renderItems();
  updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function renderHistory() {
  const records = loadRecords();
  const list = document.getElementById("historyList");
  if (records.length === 0) {
    list.innerHTML = '<div class="empty-history">暂无历史记录</div>';
    return;
  }
  list.innerHTML = records.map((r, i) => {
    const rate = r.rate || 0;
    let rateCls = "rate";
    if (rate < 70) rateCls = "rate bad";
    else if (rate < 90) rateCls = "rate mid";
    return `
      <div class="history-item">
        <div class="info">
          <div class="name">${escapeHtml(r.projectName || "未命名")} · ${escapeHtml(r.checkDate || "无日期")}</div>
          <div class="meta-line">
            检查人：${escapeHtml(r.inspector || "—")} · 受检分部：${escapeHtml(r.checkedUnit || "—")}
          </div>
        </div>
        <div class="${rateCls}">${rate.toFixed(1)}% ${r.conclusion || ""}</div>
        <div class="actions">
          <button class="open" onclick="openRecord(${i})">打开</button>
          <button class="del" onclick="deleteRecord(${i})">删除</button>
        </div>
      </div>
    `;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function openRecord(i) {
  const records = loadRecords();
  const r = records[i];
  if (!r) return;
  document.getElementById("projectName").value = r.projectName || "";
  document.getElementById("checkDate").value = r.checkDate || "";
  document.getElementById("inspector").value = r.inspector || "";
  document.getElementById("checkedUnit").value = r.checkedUnit || "";
  document.getElementById("remark").value = r.remark || "";
  document.getElementById("signInspector").value = r.signInspector || "";
  document.getElementById("signInspectorDate").value = r.signInspectorDate || "";
  document.getElementById("signChecked").value = r.signChecked || "";
  document.getElementById("signCheckedDate").value = r.signCheckedDate || "";
  selectedCats = new Set(r.selectedCats || []);
  document.querySelectorAll(".cat-btn").forEach(btn => {
    if (selectedCats.has(btn.dataset.cat)) btn.classList.add("active");
    else btn.classList.remove("active");
  });
  renderItems();
  const answers = r.answers || [];
  visibleItems.forEach((_, idx) => {
    const val = answers[idx] || "";
    document.querySelectorAll(`input[name="item${idx}"]`).forEach(inp => {
      inp.checked = (inp.value === val);
    });
  });
  updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteRecord(i) {
  if (!confirm("确定删除这条记录？删除后不可恢复。")) return;
  const records = loadRecords();
  records.splice(i, 1);
  saveRecords(records);
  renderHistory();
}

function exportPDF() {
  if (visibleItems.length === 0) { alert("请先选择至少一个检查类别"); return; }
  const data = collectData();
  if (!data.projectName && !data.checkDate) {
    if (!confirm("工程名称和检查日期都没填，仍要导出吗？")) return;
  }
  const oldTitle = document.title;
  const fileName = (data.projectName || "TY9") + "_" + (data.checkDate || "无日期");
  document.title = fileName;
  setTimeout(() => { window.print(); document.title = oldTitle; }, 100);
}

renderCatButtons();
renderItems();
applySiteInfo();
updateStats();
renderHistory();
</script>
